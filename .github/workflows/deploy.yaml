name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: seori_back
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/seori-back:latest
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back

      - uses: docker/build-push-action@v6
        with:
          context: seori_front
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/seori-front:latest
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/seori
            docker compose pull backend frontend
            docker compose up -d
            docker image prune -f
