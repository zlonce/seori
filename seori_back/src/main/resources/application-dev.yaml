server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/seori
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: 1800000
  refresh:
    expiration: 604800000

front:
  url: http://localhost:5173
